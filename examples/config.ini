# driftpaper configuration
# Copy to ~/.config/driftpaper/config.ini (Flatpak: ~/.var/app/io.github.casper_rs.driftpaper/config/driftpaper/config.ini).
# Changes are picked up while driftpaper runs. Every key is optional.

# Start from a built-in look, then override anything below. See: driftpaper --list
# preset = shards

[general]
# Turn the wallpaper off without uninstalling; a running wallpaper exits when this becomes false.
enabled = true

# Any PNG, JPEG, BMP, TGA or GIF. Relative paths are relative to this file.
image = ~/Pictures/wallpaper.png

# A different picture for one monitor, by connector name (see the settings window or
# `cosmic-randr list` / `wlr-randr`). Monitors without one use the main image.
# image.DP-2 = ~/Pictures/left.png

# Stretch the main image across all monitors as one picture (per-monitor images are ignored).
span = false

# COSMIC only: export a still of each monitor and use it as COSMIC's background, so the lock and
# login screens match. This replaces the background chosen in COSMIC Settings.
lock_screen_sync = false

# auto | gpu | cpu. "gpu" prefers the dedicated GPU (NVIDIA or DRI_PRIME), "cpu" uses software
# rendering for machines without working graphics drivers. Changing it needs a restart.
renderer = auto

# Frames per second. auto = 30 on the GPU, 12 on the CPU.
fps = auto

# Render at a fraction of the screen resolution and let the compositor scale it up.
# auto = 1 on the GPU, 0.35 on the CPU. Lower values save power.
render_scale = auto

# Monitors to draw on, by connector name (e.g. DP-1, HDMI-A-1), or "all".
outputs = all

[particles]
count = 180

# orbit (around the subject) | rise | fall | drift
motion = orbit

# triangle, square, spark, circle, ring, diamond, star, plus. Optional weight after a colon.
shapes = triangle:0.4, square:0.28, spark:0.32

# Sprite size range in pixels on a 1440p screen (scaled with the resolution).
size = 9-20
opacity = 0.3-0.8

# Speed multiplier. For orbit, speed_falloff makes the outermost particles that many times faster.
speed = 1
speed_falloff = 6
spin = 1

# 0 = steady, 1 = strong flicker
twinkle = 0.35

# Orbit only: slow in-and-out drift in pixels (0 disables it).
breathe = 30

# Orbit only: even | outer (more particles further out) | inner
distribution = even

# Orbit only: both | cw | ccw
direction = both

# Empty zone around the subject and the outer edge of the particle field, as fractions of the
# image height. auto measures the subject in the image.
inner_radius = auto
outer_radius = 0.57

# Orbit centre as x, y fractions of the image, or auto to use the detected subject.
center = auto

# Horizontal stretch of the orbit (1 = circle).
ellipse = 1.45

# Particle colours: auto picks them from the image, or list hex colours.
colors = auto

# Fraction of particles drawn near-white.
white = 0.3

# Change for a different random layout.
seed = 42

[background]
# fill (crop to cover) | fit (letterbox) | stretch
scale = fill
bg_color = #000000

# Animated colour fog and the breathing glow around the subject (0 disables).
fog = 0.3
glow = 1
glow_color = auto
pulse = 1

# Image adjustments.
brightness = 0
contrast = 1
saturation = 1

# Change the lightness of one hue range: hue in degrees, range width in degrees, lightness change.
# Example: 220, 40, -0.2 darkens blues by 20%.
hue_adjust = off

[music]
# Pulse the glow and particles to whatever the speakers play (needs PulseAudio or pipewire-pulse).
music = false

# ring (equaliser bars) | halo (liquid glowing outlines) | ripples (a shock wave on every beat)
# | glow (only the glow and particles pulse)
music_style = ring

# Small round badge in the bottom-right corner of the desktop: bars | dial | vinyl | off
music_badge = bars

# How strongly the look reacts, 0.1-5.
music_sensitivity = 1

# default listens to the speakers; or a source name from `pactl list short sources`.
music_source = default

# Size of the visualiser, 0.5-2.
music_size = 1

# Brightness of the visualiser and badge, 0-3.
music_brightness = 1

# Number of bars around the ring, 24-144.
music_bars = 72

# Dark band behind the visualiser that keeps it readable on bright pictures, 0-1.
music_shadow = 0.4

# auto uses the glow colours; or one or two colours, bass then treble: #4fc3f7, #ff6ec7
music_colors = auto
